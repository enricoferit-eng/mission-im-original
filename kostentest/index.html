<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kosten-Test</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#1d241b;color:#f4efe3;font-family:system-ui,sans-serif;padding:16px;max-width:1000px;margin:auto}
h1{font-family:"Lilita One",system-ui;font-weight:400;font-size:26px;margin:4px 0}
h2{font-family:"Lilita One",system-ui;font-weight:400;color:#95C11F;margin:26px 0 6px}
p{color:#cfd8c4;margin:4px 0 10px;line-height:1.4}
canvas{width:100%;border-radius:12px;display:block;background:#000}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
figure{margin:0;background:#2a3427;border-radius:12px;padding:8px}
figure img{width:100%;border-radius:8px;display:block;background:#fff}
figcaption{padding:6px 2px 0;font-weight:600}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:13px;font-weight:700;margin-left:4px}
.ok{background:#95C11F;color:#17200f}.bad{background:#d8463f;color:#fff}
</style></head><body>
<h1>Kosten-Test: günstiges Modell</h1>
<p>Hund und Ritter-Katze wurden jeweils komplett (stehen + laufen in 3 Richtungen) auf <b>einem</b> Bild gemalt – <b>65 Credits</b> pro Figur statt ca. 310.</p>

<h2>So laufen sie in der Küche</h2>
<canvas id="cv" width="1200" height="760"></canvas>

<h2>Alle Laufbilder einzeln (in Bewegung)</h2>
<canvas id="strip" width="1200" height="520"></canvas>

<h2>Die gemalten Bögen</h2>
<div class="row">
<figure><img src="bogen_hund.jpg"><figcaption>Hund – 65 Credits <span class="tag ok">gut</span></figcaption></figure>
<figure><img src="bogen_ritter.jpg"><figcaption>Katze im Ritter-Kostüm – 65 Credits <span class="tag ok">gut</span></figcaption></figure>
</div>

<h2>Billig-Modelle für Leckereien</h2>
<div class="row">
<figure><img src="essen_5credits.jpg"><figcaption>5 Credits <span class="tag bad">kein Low Poly, Sachen fehlen</span></figcaption></figure>
<figure><img src="essen_1credit.jpg"><figcaption>1 Credit <span class="tag bad">falscher Stil</span></figcaption></figure>
</div>
<script>
'use strict';
const IMG={};let left=0;
const load=n=>{left++;const i=new Image();i.onload=()=>left--;i.src=n;return i};
IMG.map=load('map.jpg');
for(const who of['hund','ritter']){for(const d of['side','front','back'])for(let i=0;i<6;i++)IMG[`${who}_${d}_${i}`]=load(`${who}_${d}_${i}.png`);IMG[who+'_stand']=load(`${who}_stand_front.png`)}
// Rundgänge in freien Gängen der Küche (Welt-Koordinaten 1400×900)
const walkers=[
  {who:'hund',pts:[[650,330],[800,330],[800,800],[650,800]],i:0,x:650,y:330,dist:0,face:'front',flip:1,wait:0},
  {who:'ritter',pts:[[1060,330],[1180,330],[1180,750],[1060,750]],i:0,x:1060,y:330,dist:0,face:'front',flip:1,wait:0},
];
const cv=document.getElementById('cv'),c=cv.getContext('2d'),st=document.getElementById('strip'),s=st.getContext('2d');
const VX=560,VY=240,VW=720,VH=456,K=cv.width/VW;   // sichtbarer Ausschnitt der Küche
function spr(g,im,x,y,h,flip){const w=h*im.naturalWidth/im.naturalHeight;g.save();g.translate(x,y);g.fillStyle='rgba(40,25,10,.28)';g.beginPath();g.ellipse(0,-2,w*.4,h*.07,0,0,7);g.fill();g.scale(flip,1);g.drawImage(im,-w/2,-h,w,h);g.restore()}
let last=performance.now(),T=0;
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
  if(!left){
    for(const w of walkers){if(w.wait>0){w.wait-=dt;continue}const[tx,ty]=w.pts[(w.i+1)%w.pts.length],dx=tx-w.x,dy=ty-w.y,d=Math.hypot(dx,dy),v=120*dt;
      if(Math.abs(dx)>Math.abs(dy)){w.face='side';w.flip=dx<0?-1:1}else w.face=dy<0?'back':'front';
      if(d<=v){w.x=tx;w.y=ty;w.i=(w.i+1)%w.pts.length;w.wait=.6}else{w.x+=dx/d*v;w.y+=dy/d*v;w.dist+=v}}
    c.setTransform(K,0,0,K,-VX*K,-VY*K);c.drawImage(IMG.map,0,0,1400,900);
    [...walkers].sort((a,b)=>a.y-b.y).forEach(w=>{const im=w.wait>0?IMG[w.who+'_stand']:IMG[`${w.who}_${w.face}_${Math.floor(w.dist/11)%6}`];spr(c,im,w.x,w.y,96,w.wait>0||w.face!=='side'?1:w.flip)});
    c.setTransform(1,0,0,1,0,0);
    s.fillStyle='#E3CFAE';s.fillRect(0,0,st.width,st.height);const f=Math.floor(T*9)%6;
    ['hund','ritter'].forEach((who,r)=>['front','side','back'].forEach((d,k)=>{spr(s,IMG[`${who}_${d}_${f}`],200+k*400,240+r*260,200,1)}));
  }
  requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script></body></html>
